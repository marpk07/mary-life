<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MARY · Póker</title>
<link rel="stylesheet" href="mary-theme.css">
<link rel="stylesheet" href="poker-theme.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf7fc;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fdf7fc}
</style>
</head>
<body>
<iframe id="poker-frame" src="poker-fixed%20(9).html" title="Póker"></iframe>
<script>
(function(){
  var f=document.getElementById('poker-frame');
  function inject(){
    try{
      var d=f.contentDocument; if(!d) return;
      ['mary-theme.css','poker-theme.css'].forEach(function(href){
        if(d.querySelector('link[href="'+href+'"]')) return;
        var l=d.createElement('link');
        l.rel='stylesheet';
        l.href=href;
        d.head.appendChild(l);
      });
      var s=d.createElement('style');
      s.textContent=[
        'html,body{background:#fdf7fc!important;color:#4a3560!important;}',
        '.glass-card,.glass-card-solid,.bg-white,[class*="bg-[#fcf"],[class*="bg-[#f0e"],[class*="bg-[#f5e"],[class*="bg-[#f7d"],[class*="bg-[#fdf"],[class*="bg-[#fce"]{background:rgba(255,255,255,.95)!important;background-color:rgba(255,255,255,.95)!important;color:#4a3560!important;border-color:rgba(214,140,190,.22)!important;}',
        'header,header.sticky{background:linear-gradient(135deg,#ffffff,#f3e8fb)!important;border-bottom:1px solid rgba(214,140,190,.25)!important;color:#4a3560!important;}',
        '.nav-btn{background:rgba(255,255,255,.06)!important;color:#8b7aa3!important;}',
        '.nav-btn.active{background:linear-gradient(135deg,#ec4899,#a78bfa)!important;color:#fff!important;}',
        'input,select,textarea{background:#f6effa!important;border:1px solid rgba(214,140,190,.28)!important;color:#4a3560!important;color-scheme: light;}',
        '.text-stone-700,.text-stone-800,.text-stone-900,.text-gray-800,.text-black{color:#4a3560!important;}',
        '.text-stone-500,.text-stone-600,.text-gray-500{color:#8b7aa3!important;}',
        'label,[class*="uppercase"]{color:#8b7aa3!important;}'
      ].join('');
      d.head.appendChild(s);
    }catch(e){ console.warn(e); }
  }
  f.addEventListener('load', inject);
  setTimeout(inject, 500);
})();
</script>
</body>
</html>
