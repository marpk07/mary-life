<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARY · Entreno / rehab</title>
<link rel="stylesheet" href="mary-theme.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
:root{--bg:#0f0a14;--card:rgba(28,20,40,.92);--border:rgba(244,114,182,.22);--pink:#f472b6;--text:#f5eef8;--muted:#c4b5d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);
background:radial-gradient(circle at 15% 10%,rgba(244,114,182,.12),transparent 42%),radial-gradient(circle at 90% 90%,rgba(167,139,250,.1),transparent 42%),var(--bg);
padding:max(.75rem,env(safe-area-inset-top)) .85rem 5rem}
.wrap{max-width:720px;margin:0 auto}
.glass{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:.65rem}
.pad{padding:.85rem}
h1{margin:0;font-size:1.1rem;font-weight:800;background:linear-gradient(90deg,#f9a8d4,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted);font-size:.75rem}
.sec{font-size:.72rem;font-weight:800;color:#f9a8d4;margin:.75rem 0 .4rem;text-transform:uppercase;letter-spacing:.04em}
.btn{border:none;border-radius:12px;padding:.5rem .8rem;font-weight:700;font-size:.75rem;cursor:pointer}
.btn-pink{background:linear-gradient(135deg,#ec4899,#a78bfa);color:#fff}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
.btn-sm{font-size:.7rem;padding:.35rem .55rem}
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:.55rem 0}
.tab{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid transparent;border-radius:999px;padding:.4rem .75rem;font-size:.72rem;font-weight:700;cursor:pointer}
.tab.active{background:rgba(236,72,153,.25);color:#fff;border-color:rgba(244,114,182,.4)}
input,select,textarea{width:100%;background:#1a1224;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:.45rem .55rem;font-size:.85rem}
label{display:block;font-size:.65rem;font-weight:700;color:var(--muted);margin-bottom:.15rem}
.tpl-card{display:block;width:100%;text-align:left;background:rgba(15,10,20,.4);border:1px solid var(--border);border-radius:14px;padding:.7rem .8rem;margin-bottom:.4rem;cursor:pointer;color:var(--text)}
.tpl-card b{display:block;font-size:.88rem;margin-bottom:.15rem}
.tpl-card .muted{font-size:.7rem}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.ex-card{margin-bottom:.55rem}
.hist{font-size:.68rem;color:#ddd6fe;margin:.2rem 0 .35rem}
.set-row{display:flex;gap:.35rem;align-items:center;margin-bottom:.3rem}
.set-n{font-size:.7rem;font-weight:800;color:var(--muted);min-width:1.4rem}
.set-row input{flex:1}
.timer-row{display:flex;gap:.35rem;align-items:center;margin:.35rem 0;flex-wrap:wrap}
.note-in{margin-top:.35rem}
#timer-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:40;background:#1c1428;border:1px solid var(--border);border-radius:16px;padding:.65rem 1rem;display:none;align-items:center;gap:.75rem}
#timer-display{font-size:1.4rem;font-weight:800;color:#f9a8d4;min-width:4.5rem;text-align:center}
.report{white-space:pre-wrap;font-size:.78rem;background:rgba(15,10,20,.5);padding:.75rem;border-radius:12px;border:1px solid var(--border);max-height:50vh;overflow:auto}
.hist-card{margin-bottom:.45rem}
.plan-note{margin:.25rem 0;font-size:.72rem}
.chk{font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="glass pad">
    <h1>Entreno / rehab</h1>
    <p class="muted" style="margin:.15rem 0 0">Rutina v3 · calentamiento · rehab · gym · reloj</p>
    <p id="sync-status" class="muted" style="margin:.2rem 0 0;font-size:.68rem">…</p>
    <div class="tabs">
      <button type="button" class="tab active" data-t="home" onclick="showTab('home')">Nueva sesión</button>
      <button type="button" class="tab" data-t="session" onclick="showTab('session')">En curso</button>
      <button type="button" class="tab" data-t="history" onclick="showTab('history')">Historial</button>
      <button type="button" class="tab" data-t="fisio" onclick="showTab('fisio')">Reporte fisio</button>
    </div>
  </div>
  <div id="panel-home">
    <div class="glass pad">
      <label>Fecha de la sesión</label>
      <input type="date" id="session-date">
      <p class="muted" style="margin:.4rem 0 0">Rehab y gym son sesiones separadas. Elige solo el bloque de ahora.</p>
    </div>
    <div id="tpl-list"></div>
  </div>
  <div id="panel-session" style="display:none">
    <div id="session-body"><p class="muted pad">No hay sesión en curso. Ve a <b>Nueva sesión</b>.</p></div>
  </div>
  <div id="panel-history" style="display:none">
    <div class="glass pad">
      <div class="grid2">
        <div><label>Desde</label><input type="date" id="hist-from" onchange="refreshHistory()"></div>
        <div><label>Hasta</label><input type="date" id="hist-to" onchange="refreshHistory()"></div>
      </div>
      <button type="button" class="btn btn-ghost" style="margin-top:.45rem" onclick="refreshHistory()">Filtrar</button>
      <p class="muted" style="margin:.35rem 0 0">Filtra por fechas. Ver/borrar sesiones. Sync Firebase celular ↔ PC.</p>
    </div>
    <div id="history-body" class="pad"></div>
  </div>
  <div id="panel-fisio" style="display:none">
    <div class="glass pad">
      <div class="grid2">
        <div><label>Desde</label><input type="date" id="fisio-from" onchange="refreshFisio()"></div>
        <div><label>Hasta</label><input type="date" id="fisio-to" onchange="refreshFisio()"></div>
      </div>
      <button type="button" class="btn btn-ghost" style="margin-top:.5rem" onclick="refreshFisio()">Actualizar</button>
    </div>
    <div id="fisio-body" class="pad"></div>
  </div>
</div>
<div id="timer-bar">
  <span id="timer-display">00:00</span>
  <button type="button" class="btn btn-ghost" onclick="stopTimerBtn()">Parar</button>
</div>
<script src="entreno-rehab-loader.js?v=7"></script>
</body>
</html>
