<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7fc">
<title>MARY · Life Suite</title>
<link rel="stylesheet" href="mary-theme.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
.shell{display:flex;height:100%}
.sidebar{width:250px;flex-shrink:0;background:rgba(255,255,255,.85);border-right:1px solid var(--border);padding:1.1rem .8rem;overflow-y:auto;backdrop-filter:blur(8px)}
.brand{font-weight:800;font-size:1.15rem;margin:0 .4rem 1rem;background:linear-gradient(90deg,#e0589a,#8b6fc4);-webkit-background-clip:text;background-clip:text;color:transparent}
.grp{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b3a4c6;margin:1rem .6rem .3rem}
.nav-item{display:flex;align-items:center;gap:.6rem;width:100%;min-height:42px;padding:.5rem .7rem;border:0;border-radius:14px;background:transparent;color:var(--muted);font:700 .88rem inherit;font-family:inherit;cursor:pointer;text-align:left}
.nav-item:hover{background:#f6effa}
.nav-item.active{background:linear-gradient(135deg,#fbe4f0,#ede4fa);color:#b04a86}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.7rem;padding:calc(.6rem + env(safe-area-inset-top,0px)) 1rem .6rem;border-bottom:1px solid var(--border);background:rgba(253,247,252,.92);backdrop-filter:blur(8px)}
#btn-menu{display:none;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:.4rem .7rem;font-size:1rem;cursor:pointer}
#view-title{font-weight:800}
.content{flex:1;position:relative;overflow:hidden}
.view{display:none;height:100%;overflow:auto}.view.active{display:block}
.module-frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.dash{max-width:960px;margin:0 auto;padding:1.3rem 1.2rem 3rem}
.hero{border-radius:28px;padding:1.7rem;background:linear-gradient(135deg,#f48fb9 0%,#c08be6 60%,#9b7fd6 100%);box-shadow:0 14px 34px rgba(155,127,214,.35);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero small{font-weight:700;text-transform:capitalize;opacity:.9}
.hero h1{margin:.2rem 0 .5rem;font-size:1.8rem;color:#fff}
.hero p{margin:0;font-size:.95rem;max-width:34ch;line-height:1.45;opacity:.96;position:relative;z-index:1}
.dash h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#a58bc4;margin:1.7rem .3rem .7rem}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem}
.qcard{border:0;border-radius:24px;padding:1.2rem;color:#fff;text-align:left;font-family:inherit;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(155,127,214,.3);transition:transform .15s}
.qcard:hover{transform:translateY(-3px)}
.qcard .e{font-size:1.9rem}.qcard b{font-size:1.05rem;display:block}.qcard span{font-size:.78rem;opacity:.92}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1rem}
.panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:.5rem .5rem .6rem;box-shadow:0 8px 22px rgba(167,139,218,.13)}
.panel h3{margin:.7rem .8rem .4rem;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:#a07bc8;display:flex;align-items:center;gap:.5rem}
.panel h3:before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#f48fb9,#9b7fd6)}
.row{display:flex;align-items:center;gap:.8rem;width:100%;border:0;background:transparent;padding:.55rem .6rem;border-radius:16px;cursor:pointer;font-family:inherit;color:inherit;text-align:left}
.row:hover{background:#f8eefb}
.ico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;box-shadow:0 4px 10px rgba(155,127,214,.28)}
.row div{flex:1;min-width:0}.row b{display:block;font-size:.92rem}.row span{font-size:.75rem;color:var(--muted)}
.row:after{content:"›";font-size:1.4rem;color:#c3a9dd}
@media(max-width:800px){
  #btn-menu{display:block}
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-105%);transition:transform .22s;box-shadow:8px 0 30px rgba(120,80,160,.18);padding-top:calc(1rem + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"><div class="brand">MARY Life 💗</div><div id="nav"></div></aside>
  <div class="main">
    <div class="topbar"><button id="btn-menu" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><span id="view-title">Inicio</span></div>
    <div class="content" id="content">
      <div id="view-home" class="view active"><div class="dash">
        <div class="hero"><small id="today"></small><h1 id="hello">Hola, Mary</h1><p id="phrase"></p></div>
        <h2>Para hoy</h2><div class="quick" id="quick"></div>
        <h2>Todas tus áreas</h2><div class="panels" id="areas"></div>
      </div></div>
    </div>
  </div>
</div>
<script>
// Una sola lista alimenta el menú, las tarjetas y las pantallas
var GROUPS=[
 ['Trabajo',[['poker','♠️','Póker','Sesiones y bankroll','poker.html','#f3e3fb'],['calificaciones','📊','Calificaciones','Equipo y bonos','calificaciones.html','#fbe4f0'],['checklist','☑️','Checklist','Operativa del día','checklist.html','#ede4fa']]],
 ['Salud',[['fitness','💪','Fitness','Entrenamiento','fitness.html','#fbe4f0'],['entreno','🩹','Entreno / rehab','Rutina · fisio · gym','entreno-rehab.html','#f3e3fb'],['alimentacion','🍽️','Alimentación','Macros y salsas','alimentacion.html','#ede4fa']]],
 ['Mi día',[['planner','📅','Planner','Día a día','planner.html','#ede4fa'],['pendientes','✅','Pendientes','Tareas abiertas','pendientes.html','#fbe4f0'],['gastos','💰','Gastos','Dinero','gastos.html','#f3e3fb'],['metas','🎯','Metas','Objetivos y retos','metas.html','#fbe4f0']]],
 ['Fe',[['espiritual','🕊️','Espiritual','Devocional','espiritual.html','#ede4fa'],['convicciones','✝️','Convicciones','21 pilares','convicciones.html','#f3e3fb']]],
 ['Más',[['guia','📖','Guía','Cómo usar MARY','guia.html','#fbe4f0'],['cierre','📋','Cierres','Cierre del día','cierre.html','#ede4fa'],['resumenes','📝','Resúmenes','Resumen semanal','resumenes.html','#f3e3fb']]]
];
var nav=document.getElementById('nav'),areas=document.getElementById('areas'),content=document.getElementById('content');
var G=['linear-gradient(135deg,#f48fb9,#e8629f)','linear-gradient(135deg,#b9a0ec,#9577d8)','linear-gradient(135deg,#d3a6f0,#b57fe0)','linear-gradient(135deg,#f7a8cb,#c993e8)'];
var TITLES={home:'Inicio'},n=0,ALL={};
nav.innerHTML='<button class="nav-item active" data-view="home" onclick="go(\'home\')">🏠 Inicio</button>';
GROUPS.forEach(function(g){
  nav.insertAdjacentHTML('beforeend','<div class="grp">'+g[0]+'</div>');
  var rows='';
  g[1].forEach(function(a,i){
    TITLES[a[0]]=a[2];ALL[a[0]]=a;
    nav.insertAdjacentHTML('beforeend','<button class="nav-item" data-view="'+a[0]+'" onclick="go(\''+a[0]+'\')">'+a[1]+' '+a[2]+'</button>');
    rows+='<button class="row" onclick="go(\''+a[0]+'\')"><div class="ico" style="background:'+G[n++%4]+'">'+a[1]+'</div><div><b>'+a[2]+'</b><span>'+a[3]+'</span></div></button>';
    content.insertAdjacentHTML('beforeend','<div id="view-'+a[0]+'" class="view" data-src="'+a[4]+'"></div>');
  });
  areas.insertAdjacentHTML('beforeend','<div class="panel"><h3>'+g[0]+'</h3>'+rows+'</div>');
});
['planner','pendientes','checklist'].forEach(function(id,i){
  var a=ALL[id];
  document.getElementById('quick').insertAdjacentHTML('beforeend','<button class="qcard" style="background:'+G[[0,1,2][i]]+'" onclick="go(\''+id+'\')"><span class="e">'+a[1]+'</span><div><b>'+a[2]+'</b><span>'+a[3]+'</span></div></button>');
});
var PHRASES=['Un día a la vez, con calma y con cariño.','Hoy hazlo con amor, aunque sea poquito.','Tu ritmo también es avanzar.','Descansar también es parte del plan.','Pequeños pasos, grandes cambios.','Eres más fuerte de lo que crees.','Respira, agradece y sigue.'];
document.getElementById('phrase').textContent=PHRASES[new Date().getDay()];
function go(v){
  document.querySelectorAll('.view').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('.nav-item').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});
  var el=document.getElementById('view-'+v);
  if(el.dataset.src&&!el.firstChild){el.innerHTML='<iframe class="module-frame" title="'+TITLES[v]+'" src="'+el.dataset.src+'"></iframe>'}
  el.classList.add('active');
  document.getElementById('view-title').textContent=TITLES[v];
  document.getElementById('sidebar').classList.remove('open');
  if(history.replaceState)history.replaceState(null,'','#'+v);
}
var h=new Date().getHours();
document.getElementById('hello').textContent=(h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches')+', Mary 💗';
document.getElementById('today').textContent=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
var start=location.hash.slice(1);if(start&&TITLES[start])go(start);
</script>
</body>
</html>
