<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARY · Gastos</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fdf2f8,#fce7f3,#f3e8ff);color:#4a2c3d}
.glass{background:rgba(255,255,255,.92);border:1px solid rgba(249,168,212,.45);border-radius:1rem;box-shadow:0 8px 24px rgba(120,80,100,.07)}
.hidden{display:none!important}
</style>
</head>
<body class="p-3 pb-24">
<header class="glass p-3 mb-3 flex justify-between items-center gap-2">
  <div>
    <h1 class="text-sm font-black">Gastos</h1>
    <p class="text-[10px] text-stone-500 font-bold">Vista simple · semana / mes</p>
  </div>
  <div class="flex gap-2">
    <button type="button" onclick="openAdd('debt')" class="px-2.5 py-1.5 bg-amber-100 text-amber-800 rounded-xl text-[10px] font-black">+ Pagar</button>
    <button type="button" onclick="openAdd('mov')" class="px-2.5 py-1.5 bg-pink-500 text-white rounded-xl text-[10px] font-black">+ Mov</button>
  </div>
</header>
<div class="flex gap-2 mb-3 text-xs flex-wrap">
  <button type="button" onclick="preset('week')" class="px-3 py-1.5 bg-pink-100 text-pink-700 rounded-xl font-black">Esta semana</button>
  <button type="button" onclick="preset('month')" class="px-3 py-1.5 bg-fuchsia-100 text-fuchsia-700 rounded-xl font-black">Este mes</button>
  <input type="date" id="from" onchange="render()" class="bg-white border border-pink-200 rounded-xl px-2 py-1 font-bold">
  <input type="date" id="to" onchange="render()" class="bg-white border border-pink-200 rounded-xl px-2 py-1 font-bold">
</div>
<div class="grid grid-cols-2 gap-2 mb-3" id="kpis"></div>
<div class="glass p-3 mb-3">
  <h2 class="font-black text-xs mb-2">Calendario</h2>
  <div id="cal" class="grid grid-cols-7 gap-1 text-center"></div>
  <p class="text-[10px] text-stone-400 font-bold mt-2">Ambar=pendiente · Verde=pagado · Azul=ingreso</p>
</div>
<div class="glass p-3 mb-3"><h2 class="font-black text-xs text-amber-700 mb-2">Por pagar</h2><div id="pend" class="space-y-1 text-xs"></div></div>
<div class="glass p-3 mb-3"><h2 class="font-black text-xs text-emerald-700 mb-2">Pagado / gastos</h2><div id="paid" class="space-y-1 text-xs"></div></div>
<div class="glass p-3 mb-3"><h2 class="font-black text-xs text-sky-700 mb-2">Ingresos</h2><div id="ing" class="space-y-1 text-xs"></div></div>
<p class="text-[10px] text-center text-stone-400 font-bold">Usa los mismos datos guardados (no se borran)</p>
<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4" style="z-index:99">
  <div class="glass p-4 w-full max-w-sm space-y-2">
    <h3 class="font-black text-sm" id="modal-title">Agregar</h3>
    <input type="hidden" id="m-kind">
    <input type="text" id="m-nombre" placeholder="Concepto" class="w-full border border-pink-200 rounded-xl px-3 py-2 text-xs font-bold">
    <div class="grid grid-cols-2 gap-2">
      <input type="number" step="0.01" id="m-monto" placeholder="Monto" class="border border-pink-200 rounded-xl px-3 py-2 text-xs font-bold">
      <select id="m-moneda" class="border border-pink-200 rounded-xl px-2 py-2 text-xs font-bold"><option value="USD">USD</option><option value="EUR">EUR</option><option value="VES">Bs</option></select>
    </div>
    <input type="date" id="m-fecha" class="w-full border border-pink-200 rounded-xl px-3 py-2 text-xs font-bold">
    <select id="m-tipo" class="w-full border border-pink-200 rounded-xl px-3 py-2 text-xs font-bold hidden">
      <option value="egreso">Egreso</option><option value="ingreso">Ingreso</option>
    </select>
    <div class="flex gap-2 pt-1">
      <button type="button" onclick="closeM()" class="flex-1 py-2 border border-pink-200 rounded-xl text-xs font-bold">Cancelar</button>
      <button type="button" onclick="saveM()" class="flex-1 py-2 bg-pink-500 text-white rounded-xl text-xs font-black">Guardar</button>
    </div>
  </div>
</div>
<script>
const KEY='MARY_GASTOS_V2';
let data={items:[],deudas:[],fijos:[],extras:{},rates:{}};
function fmt(d){const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function money(n,m){const s=(+n||0).toFixed(2);if(m==='EUR')return s+' €';if(m==='VES')return 'Bs '+s;return '$'+s}
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem('MARY_GASTOS_V1');if(!raw)return;const p=JSON.parse(raw);if(Array.isArray(p))data.items=p;else{data.items=p.items||[];data.deudas=p.deudas||[];data.fijos=p.fijos||[];data.extras=p.extras||{}}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('MARY_GASTOS_V1',JSON.stringify(data.items))}
function preset(mode){const now=new Date();document.getElementById('to').value=fmt(now);if(mode==='week'){const d=new Date(now);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);document.getElementById('from').value=fmt(d)}else{document.getElementById('from').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01'}render()}
function render(){
  const from=document.getElementById('from').value,to=document.getElementById('to').value;if(!from||!to)return;
  const deudas=(data.deudas||[]).filter(d=>d.fecha>=from&&d.fecha<=to);
  const movs=(data.items||[]).filter(m=>m.fecha>=from&&m.fecha<=to);
  const pend=deudas.filter(d=>d.estado!=='pagada'),pagadas=deudas.filter(d=>d.estado==='pagada');
  const ingresos=movs.filter(m=>m.tipo==='ingreso'),egresos=movs.filter(m=>m.tipo==='egreso');
  const sumU=arr=>arr.filter(x=>(x.moneda||'USD')==='USD').reduce((a,x)=>a+(+x.monto||0),0);
  document.getElementById('kpis').innerHTML=`<div class="glass p-3"><div class="text-[10px] font-bold text-stone-500">Por pagar</div><div class="text-lg font-black text-amber-600">$${sumU(pend).toFixed(0)}</div></div><div class="glass p-3"><div class="text-[10px] font-bold text-stone-500">Pagado</div><div class="text-lg font-black text-emerald-600">$${sumU(pagadas).toFixed(0)}</div></div><div class="glass p-3"><div class="text-[10px] font-bold text-stone-500">Ingresos</div><div class="text-lg font-black text-sky-600">$${sumU(ingresos).toFixed(0)}</div></div><div class="glass p-3"><div class="text-[10px] font-bold text-stone-500">Gastos</div><div class="text-lg font-black text-pink-600">$${sumU(egresos).toFixed(0)}</div></div>`;
  const days=[];const a=new Date(from+'T12:00:00'),b=new Date(to+'T12:00:00');
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))days.push(fmt(new Date(d)));
  const show=days.slice(0,42),by={};show.forEach(f=>by[f]={p:0,ok:0,i:0});
  pend.forEach(d=>{if(by[d.fecha])by[d.fecha].p++});pagadas.forEach(d=>{if(by[d.fecha])by[d.fecha].ok++});
  ingresos.forEach(m=>{if(by[m.fecha])by[m.fecha].i++});egresos.forEach(m=>{if(by[m.fecha])by[m.fecha].ok++});
  let cal=['L','M','X','J','V','S','D'].map(w=>`<div class="text-[10px] font-black text-stone-400 py-1">${w}</div>`).join('');
  let pad=(new Date(show[0]+'T12:00:00').getDay()+6)%7;for(let i=0;i<pad;i++)cal+='<div></div>';
  show.forEach(f=>{const info=by[f]||{p:0,ok:0,i:0};let bg='bg-white border-pink-100';if(info.p)bg='bg-amber-100 border-amber-300';else if(info.i)bg='bg-sky-100 border-sky-300';else if(info.ok)bg='bg-emerald-50 border-emerald-200';cal+=`<div class="rounded-lg border ${bg} py-2 text-[11px] font-black">${parseInt(f.slice(8),10)}</div>`});
  document.getElementById('cal').innerHTML=cal;
  const row=(arr,empty,col)=>!arr.length?`<p class="text-stone-400 font-bold">${empty}</p>`:arr.slice(0,15).map(x=>{const n=x.nombre||x.concepto||'—';return `<div class="flex justify-between gap-2 py-1 border-b border-pink-50"><span class="font-bold">${x.fecha} · ${n}</span><span class="font-black ${col}">${money(x.monto,x.moneda||'USD')}</span></div>`}).join('');
  document.getElementById('pend').innerHTML=row(pend,'Nada pendiente','text-amber-600');
  document.getElementById('paid').innerHTML=row(pagadas.concat(egresos.map(m=>({...m,nombre:m.concepto}))),'Sin pagos','text-emerald-600');
  document.getElementById('ing').innerHTML=row(ingresos.map(m=>({...m,nombre:m.concepto})),'Sin ingresos','text-sky-600');
}
function openAdd(kind){document.getElementById('m-kind').value=kind;document.getElementById('modal-title').textContent=kind==='debt'?'+ Pendiente / deuda':'+ Movimiento';document.getElementById('m-tipo').classList.toggle('hidden',kind!=='mov');document.getElementById('m-nombre').value='';document.getElementById('m-monto').value='';document.getElementById('m-fecha').value=fmt(new Date());document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}
function closeM(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')}
function saveM(){const kind=document.getElementById('m-kind').value;const nombre=document.getElementById('m-nombre').value.trim()||'Sin nombre';const monto=+document.getElementById('m-monto').value||0;const moneda=document.getElementById('m-moneda').value;const fecha=document.getElementById('m-fecha').value||fmt(new Date());const id=Date.now();if(kind==='debt'){data.deudas=data.deudas||[];data.deudas.push({id,nombre,monto,moneda,fecha,cat:'Deudas',estado:'pendiente',nota:'',pagadaEn:null})}else{const tipo=document.getElementById('m-tipo').value;data.items=data.items||[];data.items.push({id,tipo,concepto:nombre,monto,moneda,fecha,cat:'Otros',nota:''})}save();closeM();render()}
load();preset('week');
</script>
</body>
</html>
