<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARY · Gastos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/💸?style=apple">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background:
        radial-gradient(circle at 12% 15%, rgba(249,168,212,0.35) 0%, transparent 42%),
        radial-gradient(circle at 88% 85%, rgba(180,146,205,0.3) 0%, transparent 45%),
        linear-gradient(135deg, #fdf2f8 0%, #fce7f3 45%, #f3e8ff 100%);
      color: #4a2c3d; min-height: 100vh; margin: 0;
    }
    .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(14px); border: 1px solid rgba(249,168,212,0.45); box-shadow: 0 10px 28px rgba(120,80,100,0.07); }
    .hidden { display: none !important; }
    .modal-bg { background: rgba(74,44,61,0.45); backdrop-filter: blur(6px); z-index: 99999; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <header class="bg-gradient-to-r from-[#c879a8] via-[#d9a7c7] to-[#b492cd] text-white sticky top-0 z-40 shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-2xl bg-white/25 flex items-center justify-center font-black">💸</div>
        <div>
          <h1 class="text-sm font-black tracking-wide uppercase">MARY Gastos</h1>
          <p class="text-[10px] text-white/85">Ingresos, egresos y categorías</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="copyGastosReport()" class="px-3 py-1.5 bg-white/20 border border-white/40 rounded-xl text-xs font-bold cursor-pointer">📋 Copiar informe</button>
        <button onclick="openModal()" class="px-3 py-1.5 bg-white text-pink-700 rounded-xl text-xs font-black cursor-pointer">+ Movimiento</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full p-4 space-y-4">
    <div class="glass rounded-2xl p-3 flex flex-wrap gap-2 items-center text-xs">
      <span class="font-bold text-stone-600">Desde</span>
      <input type="date" id="from" onchange="render()" class="bg-white border border-pink-200 rounded-xl px-2 py-1 font-bold">
      <span class="font-bold text-stone-600">Hasta</span>
      <input type="date" id="to" onchange="render()" class="bg-white border border-pink-200 rounded-xl px-2 py-1 font-bold">
      <select id="filter-tipo" onchange="render()" class="bg-white border border-pink-200 rounded-xl px-2 py-1 font-bold">
        <option value="all">Todos</option>
        <option value="ingreso">Solo ingresos</option>
        <option value="egreso">Solo egresos</option>
      </select>
      <select id="filter-cat" onchange="render()" class="bg-white border border-pink-200 rounded-xl px-2 py-1 font-bold">
        <option value="all">Todas las categorías</option>
      </select>
    </div>

    <div class="grid grid-cols-3 gap-3" id="kpis"></div>
    <div class="glass rounded-2xl p-4"><canvas id="chart" height="140"></canvas></div>
    <div id="list" class="space-y-2"></div>
    <p id="empty" class="text-xs text-stone-400 text-center py-6">Sin movimientos en este rango.</p>
  </main>

  <div id="modal" class="fixed inset-0 hidden items-center justify-center p-4 modal-bg">
    <div class="glass rounded-3xl max-w-md w-full p-5 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-black text-sm text-stone-800">💸 Movimiento</h3>
        <button onclick="closeModal()" class="font-bold text-stone-400 cursor-pointer">✕</button>
      </div>
      <input type="hidden" id="edit-id">
      <div class="space-y-2 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-bold text-stone-600 block mb-0.5">Tipo</label>
            <select id="f-tipo" class="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 font-bold">
              <option value="egreso">Egreso</option>
              <option value="ingreso">Ingreso</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-stone-600 block mb-0.5">Fecha</label>
            <input type="date" id="f-fecha" class="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 font-bold">
          </div>
        </div>
        <div>
          <label class="font-bold text-stone-600 block mb-0.5">Monto</label>
          <input type="number" step="0.01" id="f-monto" class="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 font-bold" placeholder="0.00">
        </div>
        <div>
          <label class="font-bold text-stone-600 block mb-0.5">Categoría</label>
          <input type="text" id="f-cat" list="cat-list" class="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 font-bold" placeholder="Comida, transporte, ocio…">
          <datalist id="cat-list">
            <option value="Comida"><option value="Transporte"><option value="Ocio"><option value="Hogar">
            <option value="Salud"><option value="Poker"><option value="Gym"><option value="Ropa">
            <option value="Suscripciones"><option value="Ingreso trabajo"><option value="Otro">
          </datalist>
        </div>
        <div>
          <label class="font-bold text-stone-600 block mb-0.5">Nota</label>
          <input type="text" id="f-nota" class="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 font-bold" placeholder="Qué fue…">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeModal()" class="px-3 py-1.5 border border-pink-200 rounded-xl font-bold text-xs cursor-pointer">Cancelar</button>
        <button onclick="saveItem()" class="px-4 py-1.5 bg-pink-500 text-white rounded-xl font-black text-xs cursor-pointer">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnhvfyXpwJdYOQFCvsyHDhgW9F3X7ARR4",
      authDomain: "marpk-816dd.firebaseapp.com",
      projectId: "marpk-816dd",
      storageBucket: "marpk-816dd.firebasestorage.app",
      messagingSenderId: "189644122232",
      appId: "1:189644122232:web:ed7894f1510a373d44658d"
    };
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) {}

    const KEY = 'MARY_GASTOS_V1';
    let items = [];
    let chartInst = null;

    function load() {
      try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { items = []; }
      if (db) {
        db.collection('mary_gastos').doc('all').get().then(doc => {
          if (doc.exists && doc.data().items) {
            items = doc.data().items;
            localStorage.setItem(KEY, JSON.stringify(items));
            render();
          }
        }).catch(()=>{});
      }
    }
    function save() {
      localStorage.setItem(KEY, JSON.stringify(items));
      if (db) db.collection('mary_gastos').doc('all').set({ items }).catch(()=>{});
    }

    function openModal(id) {
      document.getElementById('edit-id').value = id || '';
      if (id) {
        const it = items.find(x => x.id === id);
        if (!it) return;
        document.getElementById('f-tipo').value = it.tipo;
        document.getElementById('f-fecha').value = it.fecha;
        document.getElementById('f-monto').value = it.monto;
        document.getElementById('f-cat').value = it.cat || '';
        document.getElementById('f-nota').value = it.nota || '';
      } else {
        document.getElementById('f-tipo').value = 'egreso';
        document.getElementById('f-fecha').value = new Date().toISOString().slice(0,10);
        document.getElementById('f-monto').value = '';
        document.getElementById('f-cat').value = '';
        document.getElementById('f-nota').value = '';
      }
      const m = document.getElementById('modal');
      m.classList.remove('hidden'); m.style.display = 'flex';
    }
    function closeModal() {
      const m = document.getElementById('modal');
      m.classList.add('hidden'); m.style.display = 'none';
    }

    function saveItem() {
      const monto = parseFloat(document.getElementById('f-monto').value);
      if (isNaN(monto)) { alert('Pon un monto'); return; }
      const editId = document.getElementById('edit-id').value;
      const obj = {
        id: editId ? parseInt(editId) : Date.now(),
        tipo: document.getElementById('f-tipo').value,
        fecha: document.getElementById('f-fecha').value,
        monto: monto,
        cat: (document.getElementById('f-cat').value || 'Otro').trim(),
        nota: document.getElementById('f-nota').value.trim()
      };
      if (editId) items = items.map(x => x.id === obj.id ? obj : x);
      else items.push(obj);
      save(); closeModal(); render();
    }

    function deleteItem(id) {
      if (!confirm('¿Borrar este movimiento?')) return;
      items = items.filter(x => x.id !== id);
      save(); render();
    }

    function filtered() {
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const tipo = document.getElementById('filter-tipo').value;
      const cat = document.getElementById('filter-cat').value;
      return items.filter(x => {
        if (from && x.fecha < from) return false;
        if (to && x.fecha > to) return false;
        if (tipo !== 'all' && x.tipo !== tipo) return false;
        if (cat !== 'all' && x.cat !== cat) return false;
        return true;
      }).sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
    }

    function render() {
      const list = filtered();
      // categories for filter
      const cats = [...new Set(items.map(x => x.cat).filter(Boolean))].sort();
      const sel = document.getElementById('filter-cat');
      const cur = sel.value;
      sel.innerHTML = '<option value="all">Todas las categorías</option>' + cats.map(c => '<option value="'+c+'">'+c+'</option>').join('');
      sel.value = cats.includes(cur) ? cur : 'all';

      let ing = 0, egr = 0;
      list.forEach(x => { if (x.tipo === 'ingreso') ing += x.monto; else egr += x.monto; });
      document.getElementById('kpis').innerHTML = `
        <div class="glass rounded-2xl p-3 text-center"><span class="text-[10px] font-bold text-stone-500 uppercase">Ingresos</span><p class="text-lg font-black text-emerald-600">+${ing.toFixed(2)}</p></div>
        <div class="glass rounded-2xl p-3 text-center"><span class="text-[10px] font-bold text-stone-500 uppercase">Egresos</span><p class="text-lg font-black text-pink-600">-${egr.toFixed(2)}</p></div>
        <div class="glass rounded-2xl p-3 text-center"><span class="text-[10px] font-bold text-stone-500 uppercase">Balance</span><p class="text-lg font-black text-stone-800">${(ing-egr).toFixed(2)}</p></div>`;

      const box = document.getElementById('list');
      const empty = document.getElementById('empty');
      box.innerHTML = '';
      if (list.length === 0) { empty.classList.remove('hidden'); }
      else {
        empty.classList.add('hidden');
        list.forEach(x => {
          box.innerHTML += `<div class="glass rounded-2xl p-3 flex justify-between items-center text-xs gap-2">
            <div>
              <div class="font-black text-stone-800">${x.tipo==='ingreso'?'💚':'💸'} ${x.cat} · ${x.fecha}</div>
              <div class="text-stone-500">${x.nota || ''}</div>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-black ${x.tipo==='ingreso'?'text-emerald-600':'text-pink-600'}">${x.tipo==='ingreso'?'+':'-'}${x.monto.toFixed(2)}</span>
              <button onclick="openModal(${x.id})" class="px-2 py-1 bg-white border border-pink-200 rounded-lg font-bold text-pink-600 cursor-pointer">✏️</button>
              <button onclick="deleteItem(${x.id})" class="text-red-500 font-bold cursor-pointer">✕</button>
            </div>
          </div>`;
        });
      }

      // chart by category (egresos)
      const byCat = {};
      list.filter(x => x.tipo==='egreso').forEach(x => { byCat[x.cat] = (byCat[x.cat]||0) + x.monto; });
      const labels = Object.keys(byCat);
      const data = labels.map(l => byCat[l]);
      if (chartInst) chartInst.destroy();
      const ctx = document.getElementById('chart');
      if (ctx && labels.length) {
        chartInst = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{ data, backgroundColor: ['#ec4899','#b492cd','#f9a8d4','#c879a8','#d8b4fe','#f472b6','#e879f9','#a78bfa'] }]
          },
          options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
        });
      }
    }

    function copyGastosReport() {
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const list = filtered();
      let ing = 0, egr = 0;
      list.forEach(x => { if (x.tipo==='ingreso') ing += x.monto; else egr += x.monto; });
      const nl = String.fromCharCode(10);
      let r = '💸 INFORME GASTOS' + nl + 'Desde: ' + from + ' Hasta: ' + to + nl + nl;
      r += 'Ingresos: ' + ing.toFixed(2) + nl + 'Egresos: ' + egr.toFixed(2) + nl + 'Balance: ' + (ing-egr).toFixed(2) + nl + nl;
      list.forEach(x => { r += x.fecha + ' | ' + x.tipo + ' | ' + x.cat + ' | ' + x.monto.toFixed(2) + (x.nota?' | '+x.nota:'') + nl; });
      navigator.clipboard.writeText(r).then(()=>alert('Informe copiado')).catch(()=>prompt('Copia:', r));
    }

    // default range: this month
    const now = new Date();
    document.getElementById('from').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-01';
    document.getElementById('to').value = now.toISOString().slice(0,10);
    load();
    render();
  </script>
</body>
</html>
