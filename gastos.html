<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARY Gastos</title></head>
<body style="font-family:system-ui;background:#fdf2f8;padding:2rem;color:#4a2c3d"><p id="msg">Cargando Gastos…</p>
<script>
Promise.all(['a0.txt','a1.txt','a2.txt'].map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(r.status+' '+f);return r.text();})))
.then(p=>{document.open();document.write(p.join(''));document.close();})
.catch(e=>{document.getElementById('msg').textContent='Error: '+e+' — si ves esto, avisa a Grok';});
</script></body></html>
