<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARY · Metas · That Girl Challenge</title>
<link rel="stylesheet" href="mary-theme.css">
<style id="mary-dark-force">
html,body{background:#0f0a14!important;color:#f5eef8!important;color-scheme:dark!important}
</style>
</head>
<body style="margin:0;background:#0f0a14;color:#f5eef8;font-family:system-ui;min-height:100vh">
<div id="boot" style="padding:1.5rem;text-align:center;color:#c4b5d4">Cargando That Girl Challenge…</div>
<script>
(function(){
  // Restaura el challenge completo original (metas + objetivos + frecuencia)
  // Tus datos siguen en localStorage KEY MARY_METAS_V2
  fetch('https://cdn.jsdelivr.net/gh/marpk07/mary-life@0cf6fb1173f6f5a901f35db7d4b352b24f2e0311/metas.html')
    .then(function(r){ return r.text(); })
    .then(function(html){
      if(html.indexOf('mary-theme.css')<0){
        html = html.replace('</title>','</title><link rel="stylesheet" href="mary-theme.css">');
      }
      if(html.indexOf('mary-dark-force')<0){
        html = html.replace('</head>','<style id="mary-dark-force">html,body{background:#0f0a14!important;color:#f5eef8!important;color-scheme:dark!important}.bg-white,.bg-slate-50,.bg-gray-50,.bg-pink-50{background:rgba(28,20,40,.95)!important;color:#f5eef8!important}input,textarea,select{background:#241b32!important;color:#f5eef8!important;border-color:rgba(244,114,182,.28)!important}.text-pink-800,.text-gray-600,.muted{color:#c4b5d4!important}</style></head>');
      }
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.getElementById('boot').innerHTML = 'No se pudo cargar el challenge. <button onclick="location.reload()">Reintentar</button>';
      console.error(e);
    });
})();
</script>
</body>
</html>
