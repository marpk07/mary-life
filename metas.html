<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="mary-theme.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARY · Metas · That Girl Challenge</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root { --bg:#0f0a14; --card:#1c1428; --border:rgba(244,114,182,0.18); --pink:#f472b6; --purple:#a78bfa; --text:#f5eef8; --muted:#a89bb5; }
  * { box-sizing:border-box; font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 10%, rgba(244,114,182,0.12), transparent 40%), radial-gradient(circle at 90% 90%, rgba(167,139,250,0.1), transparent 40%), var(--bg); color:var(--text); padding:max(0.75rem, env(safe-area-inset-top)) 0.85rem 2rem; }
  .glass { background:rgba(28,20,40,0.85); border:1px solid var(--border); border-radius:18px; }
  .btn { border:none; border-radius:12px; padding:0.55rem 1rem; font-weight:700; font-size:0.8rem; cursor:pointer; }
  .btn-pink { background:linear-gradient(135deg,#ec4899,#a78bfa); color:white; }
  .btn-ghost { background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--border); }
  .bar { height:10px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,#ec4899,#a78bfa); border-radius:999px; }
</style>
</head>
<body>
<div style="max-width:720px;margin:0 auto;">
  <header class="glass" style="padding:1rem 1.15rem;margin-bottom:1rem;">
    <h1 style="margin:0;font-size:1.2rem;font-weight:800;background:linear-gradient(90deg,#f9a8d4,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;">🎯 Metas · That Girl Challenge</h1>
    <p style="margin:0.25rem 0 0;font-size:0.75rem;color:var(--muted);font-weight:600;">Noviembre · seguimiento diario y resúmenes</p>
  </header>
  <div id="app" class="glass" style="padding:1.15rem;">
    <p style="color:var(--muted);font-size:0.85rem;">Si ves este mensaje, el módulo Metas se restauró en versión base con tema oscuro. Abre de nuevo o recarga; el challenge completo se mantiene en Firebase / almacenamiento local cuando esté disponible.</p>
    <div style="margin-top:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
      <button type="button" class="btn btn-pink" onclick="location.reload()">Recargar</button>
      <button type="button" class="btn btn-ghost" onclick="alert('Metas usa el mismo almacenamiento local/Firebase que antes. Si tenías datos del challenge, siguen guardados.')">¿Mis datos?</button>
    </div>
  </div>
</div>

</script>
</body>
</html>
