<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARY · Metas</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{
  background:
    radial-gradient(circle at 12% 15%, rgba(249,168,212,.35) 0%, transparent 42%),
    radial-gradient(circle at 88% 85%, rgba(180,146,205,.3) 0%, transparent 45%),
    linear-gradient(135deg,#fdf2f8 0%,#fce7f3 45%,#f3e8ff 100%);
  color:#4a2c3d;min-height:100vh;margin:0;
}
.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid rgba(249,168,212,.45);box-shadow:0 10px 28px rgba(120,80,100,.07)}
.bar{height:8px;border-radius:999px;background:#fce7f3;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ec4899,#a78bfa)}
.chip{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
.ok{background:#d1fae5;color:#065f46}
.warn{background:#fef3c7;color:#92400e}
.bad{background:#fee2e2;color:#991b1b}
.soft{background:#f3e8ff;color:#6b21a8}
.area-h{font-size:12px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#9d174d}
</style>
</head>
<body class="pb-24">
<header class="bg-gradient-to-r from-[#c879a8] via-[#d9a7c7] to-[#b492cd] text-white sticky top-0 z-40 shadow-lg">
  <div class="max-w-2xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <div>
      <h1 class="text-sm font-black tracking-wide uppercase">🎯 Metas</h1>
      <p class="text-[10px] text-white/85" id="week-label">Semana actual</p>
    </div>
    <div class="flex gap-2 flex-wrap">
      <button type="button" onclick="shiftWeek(-1)" class="px-2.5 py-1.5 bg-white/20 border border-white/40 rounded-xl text-[10px] font-bold">←</button>
      <button type="button" onclick="shiftWeek(0)" class="px-2.5 py-1.5 bg-white/20 border border-white/40 rounded-xl text-[10px] font-bold">Hoy</button>
      <button type="button" onclick="shiftWeek(1)" class="px-2.5 py-1.5 bg-white/20 border border-white/40 rounded-xl text-[10px] font-bold">→</button>
      <button type="button" onclick="copyWhatsApp()" class="px-2.5 py-1.5 bg-white text-pink-700 rounded-xl text-[10px] font-black">📋 WhatsApp</button>
    </div>
  </div>
</header>

<main class="max-w-2xl mx-auto p-4 space-y-4">
  <div class="glass rounded-2xl p-4">
    <div class="flex justify-between items-end gap-2 mb-2">
      <div>
        <div class="text-[10px] font-bold text-stone-500">Progreso de la semana</div>
        <div class="text-2xl font-black text-pink-700" id="kpi-pct">0%</div>
      </div>
      <div class="text-right text-xs font-bold text-stone-600">
        <div id="kpi-done">0 / 0 cumplidas</div>
        <div id="kpi-cards" class="text-violet-700">Tarjetas 0 / 0</div>
      </div>
    </div>
    <div class="bar"><i id="kpi-bar" style="width:0%"></i></div>
    <p class="text-[10px] text-stone-500 mt-2 font-bold leading-relaxed">
      <b>Tarjetas</b> = veces que puedes fallar esa meta en la semana.
      <b>0</b> = no puedes fallar. Los checks diarios alimentan el progreso.
    </p>
  </div>

  <div class="flex gap-2 flex-wrap text-xs">
    <button type="button" onclick="showDayModal()" class="px-3 py-2 bg-pink-500 text-white rounded-xl font-black">+ Check de hoy</button>
    <button type="button" onclick="recalcAuto(); render()" class="px-3 py-2 bg-white border border-pink-200 rounded-xl font-black text-pink-700">🔄 Leer Póker/Fitness</button>
  </div>

  <div id="areas" class="space-y-3"></div>

  <div class="glass rounded-2xl p-4 space-y-2">
    <h3 class="font-black text-sm text-stone-800">📊 Cierre de semana</h3>
    <div id="cierre" class="text-xs space-y-1 font-bold text-stone-700"></div>
  </div>
</main>

<div id="modal-day" class="fixed inset-0 hidden items-center justify-center p-4" style="background:rgba(74,44,61,.45);z-index:9999">
  <div class="glass rounded-3xl max-w-md w-full p-5 space-y-3 max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-center">
      <h3 class="font-black text-sm">Check del día</h3>
      <button type="button" onclick="closeDay()" class="font-bold text-stone-400">✕</button>
    </div>
    <input type="date" id="day-date" class="w-full bg-white border border-pink-200 rounded-xl px-3 py-2 text-xs font-bold">
    <div id="day-checks" class="space-y-2 text-xs"></div>
    <button type="button" onclick="saveDay()" class="w-full py-2.5 bg-pink-500 text-white rounded-xl font-black text-sm">Guardar día</button>
  </div>
</div>

<script>
const KEY = 'MARY_METAS_V1';
const FITNESS_KEY = 'MARY_FITNESS_DATA_V9';
const POKER_KEY = 'MARPK_POKER_DATA_V14';
const SPIRIT_KEY = 'MARY_SPIRITUAL_SPACE_V6';

const TEMPLATE = [
  { id:'fit_prot', area:'Fitness', name:'Proteína 130–140 g', kind:'daily', targetDays:7, cards:1, unit:'días ok', auto:'protein' },
  { id:'fit_cardio', area:'Fitness', name:'Cardio 3–4 × 30–40 min', kind:'count', target:4, cards:2, unit:'sesiones', auto:'cardio' },
  { id:'fit_train', area:'Fitness', name:'Entrenos 4–5', kind:'count', target:5, cards:2, unit:'entrenos', auto:'workout' },
  { id:'fit_creatina', area:'Fitness', name:'Creatina', kind:'daily', targetDays:7, cards:1, unit:'días', auto:null },
  { id:'fit_cal', area:'Fitness', name:'Calorías 1500–1600', kind:'daily', targetDays:7, cards:1, unit:'días ok', auto:null },
  { id:'fit_dulce', area:'Bienestar', name:'No dulce', kind:'daily', targetDays:7, cards:0, unit:'días', auto:null },
  { id:'fit_bici', area:'Fitness', name:'Bici 15–20 min (mañana)', kind:'daily', targetDays:7, cards:2, unit:'días', auto:null },
  { id:'pk_games', area:'Póker', name:'110 games diarios', kind:'daily', targetDays:7, cards:0, unit:'días ≥110', auto:'games' },
  { id:'pk_study', area:'Póker', name:'Estudiar 40–60 min', kind:'daily', targetDays:7, cards:2, unit:'días', auto:'study' },
  { id:'pk_hands', area:'Póker', name:'Revisión de manos 2×/sem', kind:'count', target:2, cards:5, unit:'revisiones', auto:null },
  { id:'sp_cap', area:'Espiritual', name:'1 capítulo diario', kind:'daily', targetDays:7, cards:1, unit:'días', auto:null },
  { id:'sp_dev', area:'Espiritual', name:'Devocional físico', kind:'daily', targetDays:7, cards:1, unit:'días', auto:null },
  { id:'cr_aa', area:'Crecimiento', name:'Tracker AA (amor/autoestima)', kind:'daily', targetDays:7, cards:1, unit:'días', auto:null },
  { id:'cr_gen', area:'Crecimiento', name:'Tracker general (llenar app)', kind:'daily', targetDays:7, cards:1, unit:'días', auto:null }
];

let weekOffset = 0;
let store = loadStore();

function loadStore() {
  try {
    return JSON.parse(localStorage.getItem(KEY)) || { days: {}, notes: {} };
  } catch(e) { return { days: {}, notes: {} }; }
}
function saveStore() {
  localStorage.setItem(KEY, JSON.stringify(store));
}

function startOfWeek(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  return x;
}
function addDays(d, n) {
  const x = new Date(d); x.setDate(x.getDate() + n); return x;
}
function fmt(d) {
  return d.toISOString().slice(0,10);
}
function weekRange() {
  const base = startOfWeek(new Date());
  const from = addDays(base, weekOffset * 7);
  const to = addDays(from, 6);
  return { from, to, days: Array.from({length:7}, (_,i) => fmt(addDays(from,i))) };
}
function shiftWeek(n) {
  if (n === 0) weekOffset = 0;
  else weekOffset += n;
  render();
}

function dayData(dateStr) {
  if (!store.days[dateStr]) store.days[dateStr] = {};
  return store.days[dateStr];
}

function recalcAuto() {
  const { days } = weekRange();
  try {
    const raw = localStorage.getItem(FITNESS_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      const list = data.alimentacion || data.food || data.meals || data.nutrition || [];
      const workouts = data.entrenos || data.workouts || data.entrenamientos || [];
      const cardios = data.cardio || data.cardios || [];
      days.forEach(ds => {
        const dd = dayData(ds);
        const meals = (Array.isArray(list) ? list : []).filter(m => (m.fecha||m.date||'') === ds);
        if (meals.length) {
          const prot = meals.reduce((s,m)=>s+(+m.proteina||+m.protein||0),0);
          const cal = meals.reduce((s,m)=>s+(+m.calorias||+m.calories||+m.kcal||0),0);
          if (prot >= 130 && prot <= 160) dd.fit_prot = true;
          if (cal >= 1500 && cal <= 1650) dd.fit_cal = true;
        }
        const w = (Array.isArray(workouts)?workouts:[]).filter(x => (x.fecha||x.date||'')===ds);
        if (w.length) dd._workout = (dd._workout||0) + w.length;
        const c = (Array.isArray(cardios)?cardios:[]).filter(x => (x.fecha||x.date||'')===ds);
        if (c.length) dd._cardio = (dd._cardio||0) + c.length;
      });
    }
  } catch(e) {}
  try {
    const raw = localStorage.getItem(POKER_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      const sessions = data.sessions || data.sesiones || data.items || [];
      days.forEach(ds => {
        const dd = dayData(ds);
        const ss = (Array.isArray(sessions)?sessions:[]).filter(s => (s.fecha||s.date||s.sessionDate||'')===ds);
        const games = ss.reduce((a,s)=>a+(+s.games||+s.manos||0),0);
        const study = ss.reduce((a,s)=>a+(+s.estudio||+s.studyHours||+s.study||0),0);
        if (games >= 110) dd.pk_games = true;
        const studyMin = study > 10 ? study : study * 60;
        if (studyMin >= 40) dd.pk_study = true;
      });
    }
  } catch(e) {}
  saveStore();
}

function progressFor(goal, days) {
  let done = 0;
  let fails = 0;
  if (goal.kind === 'daily') {
    days.forEach(ds => {
      const v = dayData(ds)[goal.id];
      if (v === true) done++;
      else if (v === false) fails++;
      else {
        const today = fmt(new Date());
        if (ds < today) fails++;
      }
    });
    const target = goal.targetDays || 7;
    const cardsUsed = Math.max(0, fails);
    const cardsLeft = Math.max(0, goal.cards - cardsUsed);
    const need = target - goal.cards;
    const ok = done >= need && cardsUsed <= goal.cards;
    const status = done >= target ? 'ok' : (cardsUsed > goal.cards ? 'bad' : (done >= need ? 'warn' : 'soft'));
    return { done, fails, cardsUsed, cardsLeft, target, ok, status, label: `${done}/${target} ${goal.unit}` };
  }
  let count = 0;
  days.forEach(ds => {
    const dd = dayData(ds);
    if (goal.id === 'fit_train' && dd._workout) count += dd._workout;
    else if (goal.id === 'fit_cardio' && dd._cardio) count += dd._cardio;
    else if (dd[goal.id] === true) count += 1;
    else if (typeof dd[goal.id] === 'number') count += dd[goal.id];
  });
  const target = goal.target;
  const shortfall = Math.max(0, target - count);
  const cardsUsed = shortfall;
  const cardsLeft = Math.max(0, goal.cards - cardsUsed);
  const ok = shortfall <= goal.cards;
  const status = count >= target ? 'ok' : (ok ? 'warn' : 'bad');
  return { done: count, fails: shortfall, cardsUsed, cardsLeft, target, ok, status, label: `${count}/${target} ${goal.unit}` };
}

function statusChip(st) {
  if (st === 'ok') return '<span class="chip ok">Cumplida</span>';
  if (st === 'warn') return '<span class="chip warn">Con tarjetas</span>';
  if (st === 'bad') return '<span class="chip bad">No cumplida</span>';
  return '<span class="chip soft">En curso</span>';
}

function render() {
  const { from, to, days } = weekRange();
  document.getElementById('week-label').textContent =
    `Semana ${fmt(from).slice(5)} → ${fmt(to).slice(5)}`;

  const byArea = {};
  TEMPLATE.forEach(g => {
    if (!byArea[g.area]) byArea[g.area] = [];
    byArea[g.area].push(g);
  });

  let fulfilled = 0, total = TEMPLATE.length, cardsUsedAll = 0, cardsMaxAll = 0;
  let html = '';
  Object.keys(byArea).forEach(area => {
    html += `<div class="glass rounded-2xl p-4 space-y-2"><div class="area-h">${area}</div>`;
    byArea[area].forEach(g => {
      const p = progressFor(g, days);
      cardsUsedAll += p.cardsUsed;
      cardsMaxAll += g.cards;
      if (p.status === 'ok' || (p.status === 'warn' && p.ok)) fulfilled++;
      const pct = Math.min(100, Math.round((p.done / (p.target||1)) * 100));
      html += `<div class="bg-white/70 rounded-xl p-3 border border-pink-100">
        <div class="flex justify-between gap-2 items-start">
          <div class="font-black text-xs text-stone-800">${g.name}</div>
          ${statusChip(p.status)}
        </div>
        <div class="text-[10px] font-bold text-stone-500 mt-1">${p.label} · Tarjetas ${p.cardsUsed}/${g.cards} usadas (${p.cardsLeft} libres)</div>
        <div class="bar mt-2"><i style="width:${pct}%"></i></div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('areas').innerHTML = html;

  const pct = Math.round((fulfilled / total) * 100);
  document.getElementById('kpi-pct').textContent = pct + '%';
  document.getElementById('kpi-done').textContent = `${fulfilled} / ${total} en verde o con tarjetas`;
  document.getElementById('kpi-cards').textContent = `Tarjetas usadas ${cardsUsedAll} / pool ${cardsMaxAll}`;
  document.getElementById('kpi-bar').style.width = pct + '%';

  let cierre = '';
  TEMPLATE.forEach(g => {
    const p = progressFor(g, days);
    const icon = p.status === 'ok' ? '✅' : (p.status === 'warn' ? '⚠️' : (p.status === 'bad' ? '❌' : '🔄'));
    cierre += `<div>${icon} <b>${g.name}</b> — ${p.label} · tarjetas ${p.cardsUsed}/${g.cards}</div>`;
  });
  document.getElementById('cierre').innerHTML = cierre;
}

function showDayModal() {
  const el = document.getElementById('modal-day');
  el.classList.remove('hidden'); el.classList.add('flex');
  const today = fmt(new Date());
  document.getElementById('day-date').value = today;
  buildDayChecks(today);
  document.getElementById('day-date').onchange = function(){ buildDayChecks(this.value); };
}
function closeDay() {
  const el = document.getElementById('modal-day');
  el.classList.add('hidden'); el.classList.remove('flex');
}
function buildDayChecks(ds) {
  const dd = dayData(ds);
  const box = document.getElementById('day-checks');
  const daily = TEMPLATE.filter(g => g.kind === 'daily' || g.id === 'pk_hands');
  box.innerHTML = daily.map(g => {
    const v = dd[g.id];
    const checked = v === true ? 'checked' : '';
    return `<label class="flex items-center gap-2 bg-white rounded-xl px-3 py-2 border border-pink-100 cursor-pointer">
      <input type="checkbox" data-gid="${g.id}" ${checked} class="w-4 h-4">
      <span class="font-bold text-stone-700">${g.name}</span>
      <span class="ml-auto text-[10px] text-stone-400 font-bold">${g.area}</span>
    </label>`;
  }).join('');
}
function saveDay() {
  const ds = document.getElementById('day-date').value;
  if (!ds) return;
  const dd = dayData(ds);
  document.querySelectorAll('#day-checks input[type=checkbox]').forEach(inp => {
    dd[inp.dataset.gid] = inp.checked;
  });
  saveStore();
  closeDay();
  render();
}

function copyWhatsApp() {
  const { from, to, days } = weekRange();
  let t = `🎯 Metas Mary · ${fmt(from)} → ${fmt(to)}\n\n`;
  let area = '';
  TEMPLATE.forEach(g => {
    if (g.area !== area) { area = g.area; t += `\n*${area}*\n`; }
    const p = progressFor(g, days);
    const icon = p.status === 'ok' ? '✅' : (p.status === 'warn' ? '⚠️' : (p.status === 'bad' ? '❌' : '🔄'));
    t += `${icon} ${g.name}: ${p.label} (tarjetas ${p.cardsUsed}/${g.cards})\n`;
  });
  t += `\n_Generado desde Mary Life_`;
  navigator.clipboard.writeText(t).then(() => alert('Copiado. Pégalo en WhatsApp.')).catch(() => {
    prompt('Copia este texto:', t);
  });
}

recalcAuto();
render();
</script>
</body>
</html>
