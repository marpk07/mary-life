<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARY · Calificaciones</title>
<link rel="stylesheet" href="mary-theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root {
    --bg:#0f0a14; --card:#1c1428; --border:rgba(244,114,182,0.18);
    --pink:#f472b6; --pink2:#ec4899; --purple:#a78bfa;
    --text:#f5eef8; --muted:#a89bb5;
  }
  * { box-sizing:border-box; font-family:'Plus Jakarta Sans',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; color:var(--text);
    background: radial-gradient(circle at 15% 10%, rgba(244,114,182,0.12), transparent 42%),
                radial-gradient(circle at 90% 90%, rgba(167,139,250,0.1), transparent 42%), var(--bg);
    padding: max(0.75rem, env(safe-area-inset-top)) 0.85rem 2.5rem;
  }
  .glass { background:rgba(28,20,40,0.88); border:1px solid var(--border); border-radius:18px; }
  .btn { border:none; border-radius:12px; padding:.55rem .85rem; font-weight:700; font-size:.78rem; cursor:pointer; }
  .btn-main { background:linear-gradient(135deg,#ec4899,#a78bfa); color:#fff; }
  .btn-ghost { background:rgba(255,255,255,.06); color:var(--text); border:1px solid var(--border); }
  .btn-pink { background:rgba(236,72,153,.22); color:#fbcfe8; border:1px solid rgba(244,114,182,.35); }
  .muted { color:var(--muted); font-size:.75rem; }
  .sec { font-size:.8rem; font-weight:800; color:#f9a8d4; margin:.75rem 0 .45rem; padding-bottom:.25rem; border-bottom:1px solid var(--border); }
  .tabs { display:flex; gap:.35rem; flex-wrap:wrap; margin:.5rem 0; }
  .tab { background:rgba(255,255,255,.06); color:var(--muted); border:1px solid transparent; border-radius:999px; padding:.4rem .75rem; font-size:.72rem; font-weight:700; cursor:pointer; }
  .tab.active { background:rgba(236,72,153,.25); color:#fff; border-color:rgba(244,114,182,.4); }
  input, select, textarea { width:100%; background:#1a1224; border:1px solid var(--border); border-radius:12px; color:var(--text); padding:.5rem .65rem; font-size:.85rem; }
  label { display:block; font-size:.68rem; font-weight:700; color:var(--muted); margin-bottom:.2rem; }
  .row { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
  .disc-row { display:flex; gap:.35rem; margin-bottom:.3rem; align-items:center; }
  .disc-row input:first-child { max-width:5rem; }
  h1 { margin:0; font-size:1.1rem; font-weight:800; background:linear-gradient(90deg,#f9a8d4,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .wrap { max-width:820px; margin:0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="glass" style="padding:1rem;margin-bottom:0.75rem;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;">
      <div>
        <h1>Calificaciones</h1>
        <p class="muted" style="margin:0.15rem 0 0;">Mary · Laura · Valery · cierres · bonos</p>
      </div>
    </div>
    <p id="sync-status" class="muted" style="margin:0.15rem 0 0;font-size:0.68rem;">Sincronizando…</p>
    <div class="tabs" style="margin-top:.55rem;">
      <button type="button" class="tab active" data-t="dia" onclick="showT('dia')">Día</button>
      <button type="button" class="tab" data-t="semana" onclick="showT('semana')">Semana</button>
      <button type="button" class="tab" data-t="graf" onclick="showT('graf')">Gráficos</button>
    </div>
  </div>

  <div id="panel-dia">
    <div class="glass" style="padding:1rem;margin-bottom:0.75rem;">
      <div class="row">
        <div style="flex:1;min-width:140px;">
          <label>Fecha</label>
          <input type="date" id="day-date">
        </div>
        <button type="button" class="btn btn-main" onclick="saveDay()">💾 Guardar</button>
        <button type="button" class="btn btn-ghost" onclick="loadDayForm()">↻</button>
      </div>
    </div>
    <div id="day-form"></div>
  </div>

  <div id="panel-semana" style="display:none;">
    <div class="glass" style="padding:1rem;margin-bottom:0.75rem;">
      <div class="row">
        <div style="flex:1;"><label>Desde</label><input type="date" id="range-from"></div>
        <div style="flex:1;"><label>Hasta</label><input type="date" id="range-to"></div>
        <button type="button" class="btn btn-ghost" onclick="setThisWeek()">Esta semana</button>
        <button type="button" class="btn btn-main" onclick="renderWeek()">Ver</button>
      </div>
      <div class="row" style="margin-top:.5rem;">
        <button type="button" class="btn btn-pink" onclick="copyReport()">📋 Copiar reporte</button>
      </div>
    </div>
    <div id="week-box"></div>
  </div>

  <div id="panel-graf" style="display:none;">
    <div class="glass" style="padding:1rem;margin-bottom:1rem;">
      <div class="sec" style="margin-top:0;">Promedio diario por persona (rango seleccionado)</div>
      <canvas id="chart-avg" height="200"></canvas>
    </div>
    <div class="glass" style="padding:1rem;">
      <div class="sec" style="margin-top:0;">Descuentos acumulados por persona</div>
      <canvas id="chart-disc" height="180"></canvas>
    </div>
  </div>
</div>
<script src="calificaciones-app.js?v=sync2"></script>
<script src="calificaciones-pdf.js"></script>
</body>
</html>
